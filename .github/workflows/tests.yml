name: brew test-bot
on:
  push:
    branches: master
  pull_request:
jobs:
  test-bot:
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # Both formulae declare a conflict with drasyl/tap/drasyl, and `brew deps`
      # resolves that reference, so without the tap present test-bot stops with
      # "No available formula with the name drasyl/tap/drasyl". Nothing is
      # installed from it; it only has to be readable.
      - name: Tap drasyl, referenced by conflicts_with
        run: brew tap drasyl/tap

      - name: Run tap syntax checks
        run: |
          brew style netsody/tap
          brew readall --aliases --os=all --arch=all netsody/tap
          brew audit --except=installed --except=checksum --tap=netsody/tap

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles
          path: '*.bottle.*'
