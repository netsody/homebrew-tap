name: brew pr-pull
on:
  pull_request_target:
    types:
      - labeled

# brew pr-pull needs actions: read to download the bottles artifact from the
# tests.yml run, and issues/pull-requests: read for the labels, changed files
# and "no long build conflict" checks it runs on the pull request. The
# contents: write scope is what git-try-push uses to land the bottle commits
# on master and to delete the branch at the end.
permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

jobs:
  pr-pull:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@main
        with:
          token: ${{ github.token }}
          branch: master

      - name: Delete branch
        if: github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "$BRANCH"
